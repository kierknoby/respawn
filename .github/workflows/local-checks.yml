name: Respawn Scaffold Checks
on:
  push:
    branches: [0-0-1_Dev]
  pull_request:
    branches: [0-0-1_Dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: php --version
      - run: sh tools/check.sh
      - run: php tools/demo.php